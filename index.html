<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do like me cause I like you?</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- QUESTION CARD -->
  <div class="container" id="questionBox">
    <h1 id="question">
      <span style="color:pink">Do you like me Cause I like you😍🥰😘</span>
    </h1>

    <div class="buttons" id="buttonsArea">
      <button id="yesBtn" class="btn yes">Yes</button>
      <button id="noBtn" class="btn no">No</button>
    </div>
  </div>

  <!-- ANSWER CARD -->
  <div class="container hidden" id="answerBox">
    <div class="heart">❤️ I knew it ❤️</div>
    <h2>Love you too 🥰</h2>
    <p>Thanks for saying yes — you're the best!</p>

    <img
      src="https://i.pinimg.com/1200x/06/87/c5/0687c5478ead622ecc87779c99035d8c.jpg"
      alt="Romantic roses">
  </div>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
